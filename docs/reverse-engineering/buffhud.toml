component   = "buffhud"
paths       = ["plugins/buffhud"]
shipped_as  = "d2rl-buffhud.dll"
role        = "shared"
tracked     = true
summary     = """
21-slot (3x7) temporary-buff HUD and countdown/resource tracker. Derives its
buff catalog at runtime from the active mod's Excel files (`states.txt`,
`skills.txt`, `itemstatcost.txt`, with optional loose `buff-hud.txt` override)
and spawns `BuffHud` (`BuffHudhd.json`) via PanelService.
Resolves D2RLoader's RIP-indirect bridges for `STATLIST_GetUnitStat` (0x2F5020)
and `STATLIST_PostStatList` (0x2F2CB0) with ±0x10000 slot-drift tolerance, hooks
`STATLIST_PostStatList` via InstallInlineHook, and validates exact byte witnesses
for `UNITS_GetGame` (0x48FF00), `STATLIST_GetStatListFromUnitAndState` (0x2F5940
via callsite 0x433FFC), `FindTopLevelPanel` (0x846170), `FindChildWidgetByName`
(0x856220), and `ButtonWidget` live icon-frame setters (0x859700 / 0x870460).
"""
tests       = ["scripts/run-buffhud-tests.ps1"]
regen       = []
failure_logs = [
  "Buff HUD: cannot resolve D2RLoader's qualified GetUnitStat bridge; refusing to load.",
  "Buff HUD: native panel hierarchy helpers failed build-93847 signature check; refusing native tooltip binding.",
  "Buff HUD: icon-frame backend failed build-93847 descriptor/callsite qualification; refusing to load.",
  "Buff HUD: UNITS_GetGame native fingerprint mismatch; refusing whitelist-driven buff tracking.",
  "Buff HUD: exact-state StatList lookup native fingerprint mismatch; refusing premature timer-removal tracking.",
  "Buff HUD: failed to register with the shared Core STATLIST_PostStatList bus.",
  "Blood Golem aura opt-out witness",
  "Blood Golem aura opt-out cannot resolve D2RLoader's SuppressStateStats bridge",
  "the Blood Golem aura patch was refused",
]
